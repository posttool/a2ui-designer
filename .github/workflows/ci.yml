name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (includes upstream seed checksums + starter-cache freshness)
        run: python -B -W ignore::ResourceWarning -m unittest discover -s tests -p '*_test.py'
      - name: Renderer check (headless Chrome over all upstream v1 examples + fixtures)
        if: matrix.python-version == '3.13'
        run: python -B tests/renderer_check.py
      - name: Check for internal references
        if: matrix.python-version == '3.13'
        run: |
          ! git grep -nE "google3|googlers\.com|/google/bin|b/[0-9]{6,}|corp\.google" -- . ':!seeds/a2ui' ':!.github/workflows/ci.yml'
